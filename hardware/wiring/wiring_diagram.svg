<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="2.5" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="900" fill="#ffffff"/>
  <text x="20" y="34" font-size="24" font-weight="700" fill="#111">Superdense Coding Demo Rig — Wiring Diagram</text>
  <text x="20" y="56" font-size="13" fill="#555">All GPIO numbers are BCM. See docs/design/gpio-pinout.md for the full pin table.</text>

  <!-- Battery -->
  <g>
    <rect x="30" y="120" width="150" height="80" rx="8" fill="#fff3cd" stroke="#8a6d00" stroke-width="2"/>
    <text x="105" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#5c4900">USB-C Battery</text>
    <text x="105" y="168" text-anchor="middle" font-size="12" fill="#5c4900">Power Bank</text>
    <text x="105" y="184" text-anchor="middle" font-size="11" fill="#5c4900">10,000 mAh 5V/3A</text>
  </g>
  <line x1="180" y1="160" x2="280" y2="160" stroke="#8a6d00" stroke-width="3"/>
  <text x="200" y="150" font-size="11" fill="#8a6d00">USB-C (5V)</text>

  <!-- Raspberry Pi -->
  <g>
    <rect x="280" y="70" width="260" height="360" rx="10" fill="#e7f3e8" stroke="#1c6b2b" stroke-width="2.5"/>
    <text x="410" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#134e1f">Raspberry Pi 4/5</text>

    <!-- pin stubs on right edge -->
    <!-- I2C -->
    <circle cx="540" cy="130" r="4" fill="#134e1f"/>
    <text x="500" y="126" text-anchor="end" font-size="12" fill="#134e1f">SDA · GPIO2 (pin 3)</text>
    <circle cx="540" cy="150" r="4" fill="#134e1f"/>
    <text x="500" y="146" text-anchor="end" font-size="12" fill="#134e1f">SCL · GPIO3 (pin 5)</text>
    <circle cx="540" cy="170" r="4" fill="#134e1f"/>
    <text x="500" y="166" text-anchor="end" font-size="12" fill="#134e1f">5V (pin 2/4)</text>

    <!-- Buttons -->
    <circle cx="540" cy="210" r="4" fill="#134e1f"/>
    <text x="500" y="206" text-anchor="end" font-size="12" fill="#134e1f">GPIO17 (pin 11) — CYCLE</text>
    <circle cx="540" cy="230" r="4" fill="#134e1f"/>
    <text x="500" y="226" text-anchor="end" font-size="12" fill="#134e1f">GPIO27 (pin 13) — SEND</text>

    <!-- LEDs -->
    <circle cx="540" cy="270" r="4" fill="#134e1f"/>
    <text x="500" y="266" text-anchor="end" font-size="12" fill="#134e1f">GPIO5 (pin 29) — ENTANGLED</text>
    <circle cx="540" cy="288" r="4" fill="#134e1f"/>
    <text x="500" y="284" text-anchor="end" font-size="12" fill="#134e1f">GPIO6 (pin 31) — SENT</text>
    <circle cx="540" cy="306" r="4" fill="#134e1f"/>
    <text x="500" y="302" text-anchor="end" font-size="12" fill="#134e1f">GPIO13 (pin 33) — MATCH</text>
    <circle cx="540" cy="324" r="4" fill="#134e1f"/>
    <text x="500" y="320" text-anchor="end" font-size="12" fill="#134e1f">GPIO19 (pin 35) — GATE I</text>
    <circle cx="540" cy="342" r="4" fill="#134e1f"/>
    <text x="500" y="338" text-anchor="end" font-size="12" fill="#134e1f">GPIO26 (pin 37) — GATE X</text>
    <circle cx="540" cy="360" r="4" fill="#134e1f"/>
    <text x="500" y="356" text-anchor="end" font-size="12" fill="#134e1f">GPIO20 (pin 38) — GATE Z</text>
    <circle cx="540" cy="378" r="4" fill="#134e1f"/>
    <text x="500" y="374" text-anchor="end" font-size="12" fill="#134e1f">GPIO21 (pin 40) — GATE ZX</text>

    <circle cx="540" cy="405" r="4" fill="#134e1f"/>
    <text x="500" y="401" text-anchor="end" font-size="12" fill="#134e1f">GND (common)</text>
  </g>

  <!-- LCD Alice -->
  <g>
    <rect x="700" y="60" width="220" height="90" rx="8" fill="#e8eefc" stroke="#25408f" stroke-width="2"/>
    <text x="810" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2c66">LCD 1 — "Alice"</text>
    <text x="810" y="106" text-anchor="middle" font-size="12" fill="#1a2c66">16x2, PCF8574 I2C backpack</text>
    <text x="810" y="124" text-anchor="middle" font-size="12" fill="#1a2c66">Address: 0x27</text>
  </g>

  <!-- LCD Bob -->
  <g>
    <rect x="960" y="60" width="220" height="90" rx="8" fill="#e8eefc" stroke="#25408f" stroke-width="2"/>
    <text x="1070" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2c66">LCD 2 — "Bob"</text>
    <text x="1070" y="106" text-anchor="middle" font-size="12" fill="#1a2c66">16x2, PCF8574 I2C backpack</text>
    <text x="1070" y="124" text-anchor="middle" font-size="12" fill="#1a2c66">Address: 0x26 (A0 jumper)</text>
  </g>

  <!-- I2C bus lines (shared, both LCDs) -->
  <line x1="540" y1="130" x2="620" y2="130" stroke="#25408f" stroke-width="2"/>
  <line x1="620" y1="130" x2="620" y2="105" stroke="#25408f" stroke-width="2"/>
  <line x1="620" y1="105" x2="700" y2="105" stroke="#25408f" stroke-width="2" marker-end="url(#dot)"/>
  <line x1="620" y1="105" x2="620" y2="105" stroke="#25408f" stroke-width="2"/>
  <polyline points="620,130 620,90 960,90" fill="none" stroke="#25408f" stroke-width="2" marker-end="url(#dot)"/>
  <text x="640" y="80" font-size="11" fill="#25408f">SDA (shared bus)</text>

  <line x1="540" y1="150" x2="630" y2="150" stroke="#3a5bb0" stroke-width="2"/>
  <polyline points="630,150 630,140 700,140" fill="none" stroke="#3a5bb0" stroke-width="2" marker-end="url(#dot)"/>
  <polyline points="630,150 630,70 960,70" fill="none" stroke="#3a5bb0" stroke-width="2" marker-end="url(#dot)"/>
  <text x="640" y="65" font-size="11" fill="#3a5bb0">SCL (shared bus)</text>

  <line x1="540" y1="170" x2="650" y2="170" stroke="#a45c00" stroke-width="2"/>
  <polyline points="650,170 650,120 700,120" fill="none" stroke="#a45c00" stroke-width="2" marker-end="url(#dot)"/>
  <polyline points="650,170 650,50 1010,50 1010,60" fill="none" stroke="#a45c00" stroke-width="2" marker-end="url(#dot)"/>
  <text x="655" y="185" font-size="11" fill="#a45c00">5V (both LCDs)</text>

  <!-- Buttons -->
  <g>
    <rect x="700" y="210" width="150" height="70" rx="8" fill="#fdeee0" stroke="#a4460c" stroke-width="2"/>
    <text x="775" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#7a3208">CYCLE button</text>
    <text x="775" y="256" text-anchor="middle" font-size="11" fill="#7a3208">GPIO17 -&gt; GND</text>
  </g>
  <line x1="540" y1="210" x2="700" y2="225" stroke="#a4460c" stroke-width="2"/>

  <g>
    <rect x="700" y="300" width="150" height="70" rx="8" fill="#fdeee0" stroke="#a4460c" stroke-width="2"/>
    <text x="775" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#7a3208">SEND button</text>
    <text x="775" y="346" text-anchor="middle" font-size="11" fill="#7a3208">GPIO27 -&gt; GND</text>
  </g>
  <line x1="540" y1="230" x2="700" y2="330" stroke="#a4460c" stroke-width="2"/>

  <!-- LEDs cluster -->
  <g>
    <rect x="900" y="210" width="330" height="240" rx="8" fill="#fdecec" stroke="#a11d1d" stroke-width="2"/>
    <text x="1065" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#7a1414">Status &amp; Gate LEDs (each: GPIO -&gt; 330Ω -&gt; LED -&gt; GND)</text>

    <circle cx="930" cy="260" r="8" fill="#2ecc71" stroke="#1c6b2b"/>
    <text x="950" y="264" font-size="12" fill="#7a1414">ENTANGLED — GPIO5</text>

    <circle cx="930" cy="290" r="8" fill="#f1c40f" stroke="#8a6d00"/>
    <text x="950" y="294" font-size="12" fill="#7a1414">SENT (blinks) — GPIO6</text>

    <circle cx="930" cy="320" r="8" fill="#3498db" stroke="#1a5276"/>
    <text x="950" y="324" font-size="12" fill="#7a1414">MATCH — GPIO13</text>

    <circle cx="930" cy="356" r="7" fill="#bbbbbb" stroke="#555"/>
    <text x="948" y="360" font-size="12" fill="#7a1414">GATE I — GPIO19</text>
    <circle cx="930" cy="380" r="7" fill="#e74c3c" stroke="#7a1414"/>
    <text x="948" y="384" font-size="12" fill="#7a1414">GATE X — GPIO26</text>
    <circle cx="930" cy="404" r="7" fill="#9b59b6" stroke="#4a235a"/>
    <text x="948" y="408" font-size="12" fill="#7a1414">GATE Z — GPIO20</text>
    <circle cx="930" cy="428" r="7" fill="#e67e22" stroke="#7a3208"/>
    <text x="948" y="432" font-size="12" fill="#7a1414">GATE ZX — GPIO21</text>
  </g>
  <line x1="540" y1="270" x2="900" y2="260" stroke="#a11d1d" stroke-width="1.5"/>
  <line x1="540" y1="288" x2="900" y2="290" stroke="#a11d1d" stroke-width="1.5"/>
  <line x1="540" y1="306" x2="900" y2="320" stroke="#a11d1d" stroke-width="1.5"/>
  <line x1="540" y1="324" x2="900" y2="356" stroke="#a11d1d" stroke-width="1.5"/>
  <line x1="540" y1="342" x2="900" y2="380" stroke="#a11d1d" stroke-width="1.5"/>
  <line x1="540" y1="360" x2="900" y2="404" stroke="#a11d1d" stroke-width="1.5"/>
  <line x1="540" y1="378" x2="900" y2="428" stroke="#a11d1d" stroke-width="1.5"/>

  <!-- Common ground rail -->
  <line x1="70" y1="500" x2="1200" y2="500" stroke="#333" stroke-width="3" stroke-dasharray="2,4"/>
  <text x="70" y="520" font-size="13" fill="#333" font-weight="600">Common GND rail (Pi GND pin -&gt; both buttons -&gt; all LED cathodes -&gt; both LCD GND)</text>
  <line x1="410" y1="430" x2="410" y2="500" stroke="#333" stroke-width="2"/>
  <line x1="775" y1="280" x2="775" y2="500" stroke="#333" stroke-width="1.5"/>
  <line x1="775" y1="370" x2="775" y2="500" stroke="#333" stroke-width="1.5"/>
  <line x1="1065" y1="450" x2="1065" y2="500" stroke="#333" stroke-width="1.5"/>
  <line x1="810" y1="150" x2="810" y2="500" stroke="#333" stroke-width="1.2" stroke-dasharray="1,3"/>
  <line x1="1070" y1="150" x2="1070" y2="500" stroke="#333" stroke-width="1.2" stroke-dasharray="1,3"/>

  <!-- Legend -->
  <g>
    <rect x="70" y="560" width="1140" height="120" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
    <text x="90" y="588" font-size="14" font-weight="700" fill="#222">Legend</text>
    <text x="90" y="612" font-size="12" fill="#333">Green box = Raspberry Pi (brains: runs the Qiskit simulation + reads/drives all I/O)</text>
    <text x="90" y="632" font-size="12" fill="#333">Blue boxes = LCD displays over shared I2C bus (different addresses: 0x27 Alice, 0x26 Bob)</text>
    <text x="90" y="652" font-size="12" fill="#333">Orange boxes = pushbuttons (active-low, internal pull-up, wired to GND)</text>
    <text x="620" y="612" font-size="12" fill="#333">Red box = status/gate LEDs, each behind its own 330Ω current-limiting resistor</text>
    <text x="620" y="632" font-size="12" fill="#333">Yellow box = USB-C battery pack (5V/3A) powering the whole rig untethered</text>
    <text x="620" y="652" font-size="12" fill="#333">Dashed line = common ground rail shared by every component</text>
  </g>

  <text x="20" y="880" font-size="11" fill="#888">Full pin table: docs/design/gpio-pinout.md · Part list: docs/design/bom.md · Pin constants: hardware/config.py</text>
</svg>
